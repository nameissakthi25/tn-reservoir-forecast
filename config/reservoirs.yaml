# TN reservoirs. `cwc_name` is what the bulletin prints; names drift across
# years (METTUR(STANLEY) vs METTUR) so parsing normalises parentheticals.
#
# coverage_note records what the 2015-2025 bulletin archive actually contains,
# measured -- not assumed.

reservoirs:
  - name: Mettur
    cwc_name: METTUR
    aliases: [METTUR(STANLEY)]
    river: Cauvery
    catchment: [12.10, 77.80]      # rainfall point: local + upstream approach
    lat: 11.7920
    lon: 77.8010
    live_cap_bcm: 2.647
    coverage_note: "99.4% of weeks, 2015-04-16 onward"

  - name: Bhavanisagar
